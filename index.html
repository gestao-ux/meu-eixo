<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Eixo</title>
<meta name="description" content="Gestão financeira e alimentar pessoal. Organize hoje. Viva com mais leveza.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Eixo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu principal">
    <div class="brand">
      <img src="icone.svg" width="34" height="34" alt="">
      <div><b>Meu Eixo</b><small>Organize hoje. Viva com mais leveza.</small></div>
    </div>
    <div class="space-pick"><label for="espacoSel">Espaço</label><select id="espacoSel"></select></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span id="quem"></span><button class="btn sm ghost" id="sairBtn">Sair</button></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main>
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="pageTitle">Meu Eixo</h1>
      <div class="month" id="monthNav">
        <button class="icon-btn" data-act="mes" data-n="-1" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <span id="monthLabel" class="num"></span>
        <button class="icon-btn" data-act="mes" data-n="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </header>
    <div class="view" id="view"><div class="empty"><strong>Abrindo o Meu Eixo</strong>Carregando…</div></div>
  </main>
</div>
<button class="btn primary fab" data-act="novo" data-tipo="despesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Lançamento</button>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="leitor.js"></script>
<script src="app.js"></script>
</body>
</html>
